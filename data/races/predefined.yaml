# The predefined races: vrgplrDef (PLAYER). data/datagen.py describes the
# format. Their names are the strings from idsHumanoid on, in this order.
# rgEnvVar, rgEnvVarMin and rgEnvVarMax: gravity, temperature, radiation
# (envImmune for an immune race). rgAttr is indexed by RaceStat; rsMajorAdv
# is the primary racial trait, a RaceAttribute. grbitAttr lists the lesser
# racial traits.

# Humanoid (idsHumanoid); also the defaults for a new race
- iPlayer: iplrNone
  det: detAll
  iPlrBmp: 1
  rgEnvVar: [50, 50, 50]
  rgEnvVarMin: [15, 15, 15]
  rgEnvVarMax: [85, 85, 85]
  pctIdealGrowth: 15
  pctResearch: 15
  rgAttr:
    rsResGen: 10
    rsFactProd: 10
    rsFactBuild: 10
    rsFactOperate: 10
    rsMineProd: 10
    rsMineBuild: 5
    rsMineOperate: 10
    rsUseLeftover: 0
    rsTechBonus1: 1
    rsTechBonus2: 1
    rsTechBonus3: 1
    rsTechBonus4: 1
    rsTechBonus5: 1
    rsTechBonus6: 1
    rsMajorAdv: raNone


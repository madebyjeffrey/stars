# The AI races: vrgplrComp (PLAYER), one list per AiRace (idAiRobotoid ...
# idAiMacinti), each with an entry per AiLevel (lvlAiEasy ... lvlAiExpert).
# data/datagen.py describes the format.
# rgEnvVar, rgEnvVarMin and rgEnvVarMax: gravity, temperature, radiation
# (envImmune for an immune race). rgAttr is indexed by RaceStat; rsMajorAdv
# is the primary racial trait, a RaceAttribute. grbitAttr lists the lesser
# racial traits.

# Robotoid
-
  # Robotoid, Easy
  - iPlayer: iplrNone
    det: detAll
    lSalt: -1
    rgEnvVar: [envImmune, envImmune, envImmune]
    rgEnvVarMin: [envImmune, envImmune, envImmune]
    rgEnvVarMax: [envImmune, envImmune, envImmune]
    pctIdealGrowth: 5
    pctResearch: 15
    rgAttr:
      rsResGen: 10
      rsFactProd: 12
      rsFactBuild: 10
      rsFactOperate: 16
      rsMineProd: 10

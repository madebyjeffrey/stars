# Starting starbase designs: rgshdefSBT (SHDEF). data/datagen.py describes the format.
# An entry's position is its StartingStarbase value; add new entries at the end.

- name: Starbase
  hul:
    ihuldef: ihuldefSpaceStation
    szClass: "Starbase"
    resCost: 276
    rgwtOreCost: [67, 80, 53]
    ibmp: 8
    wtCargoMax: 65535
    dp: 1000
    rghs:
      - {grhst: hstSpecialSB}
      - {grhst: hstBeam, cItem: 8}
      - {grhst: hstShield, cItem: 8}
      - {grhst: hstBeam, cItem: 8}
      - {grhst: hstShield, cItem: 8}
      - {grhst: hstShield, cItem: 8}
      - {grhst: hstSpecialEM}
      - {grhst: hstBeam, cItem: 8}
      - {grhst: hstSpecialEM}
      - {grhst: hstBeam, cItem: 8}
      - {grhst: hstSpecialSB, iItem: 1}
      - {grhst: hstShield, cItem: 8}
  det: detMinimal
  fInclude: true
  ishdef: 16
  turn: 1


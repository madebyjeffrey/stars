# Starting ship designs: rgshdefT (SHDEF). data/datagen.py describes the format.
# An entry's position is its StartingShip value; add new entries at the end.

- name: LilliputianFreighter
  hul:
    szClass: "Lilliputian Freighter"
    wtCargoMax: 70
    wtFuelMax: 200
    rghs:
      - {grhst: hstEngine, iItem: 1, cItem: 1}
      - {grhst: hstScanner, cItem: 1}
      - {grhst: hstShield, cItem: 1}
  det: detAll
  fInclude: true
  turn: 1


# Starbase hulls: rghuldefSB (HULDEF). data/datagen.py describes the format.
# An entry's position is its isbhull value; huldef is its HulDef name, numbered
# after the ship hulls. Saved ship designs store the HulDef: add new entries
# at the end; never reorder or remove one.

- name: isbhullOrbitalFort
  huldef: ihuldefOrbitalFort
  hul:
    szClass: "Orbital Fort"
    resCost: 80
    rgwtOreCost: [24, 0, 34]
    ibmp: 128
    dp: 100
    rghs:
      - {grhst: hstSomeSB, cItem: 1}
      - {grhst: hstWeapon, cItem: 12}
      - {grhst: hstShArm, cItem: 12}
      - {grhst: hstWeapon, cItem: 12}
      - {grhst: hstShArm, cItem: 12}
  init: 10
  imdAttack: hullAttackHeavy
  wrcCargo: 65535
  rgbrc: [68, 36, 70, 100, 66]


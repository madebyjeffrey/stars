# Robotoid ship designs: vrgRobAip, read by DoRobotoidAiTurn. data/datagen.py
# describes the format. Each recipe gives an AiPartPreference per slot of
# its hull; its name becomes a RobotoidRecipe, the recipe's offset
# in vrgRobAip. Code picks recipes by position through vrgRobIshAip, so
# keep the order; recipes without a hull are unused.


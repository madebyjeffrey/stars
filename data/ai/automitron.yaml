# Automitron ship designs: vrgISAip, read by DoAutomitronAiTurn. data/datagen.py
# describes the format. Each recipe gives an AiPartPreference per slot of
# its hull; its name becomes a ISRecipeOffset, the recipe's offset
# in vrgISAip. Code picks recipes by position through vrgISIshAip, so
# keep the order; recipes without a hull are unused.

- name: isOffsetColonizingMediumFreighter
  hull: ihuldefMediumFreighter
  parts:
    - aiPartEnginePreferTransStar
    - aiPartColonyPreferOrbitalConstruction
    - aiPartShieldPreferCompletePhase


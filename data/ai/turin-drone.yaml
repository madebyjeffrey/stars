# Turin Drone ship designs: vrgTDAip, read by DoTurinDroneAiTurn. data/datagen.py
# describes the format. Each recipe gives an AiPartPreference per slot of
# its hull; its name becomes a TurinDroneRecipeOffset, the recipe's offset
# in vrgTDAip. Code picks recipes by position through vrgTDIshAip, so
# keep the order; recipes without a hull are unused.

- name: tdOffsetColonizer
  hull: ihuldefColonyShip
  parts:
    - aiPartEnginePreferGalaxyScoop
    - aiPartColonyPreferOrbitalConstruction

- name: tdOffsetFrigateScout
  hull: ihuldefFrigate
  parts:
    - aiPartEnginePreferGalaxyScoop
    - aiPartScannerPreferElephant
    - aiPartTorpedo
    - aiPartShieldPreferLangstonShell


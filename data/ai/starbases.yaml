    - aiPartShieldPreferLangstonShell
    - aiPartTorpedo
    - aiPartArmorPreferMegaPolyShell
    - aiPartShieldPreferCompletePhase
    - aiPartBattleComputer
    - aiPartBeamPreferMegaDisruptor
    - aiPartSpecialJammerComputer

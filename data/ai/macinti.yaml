# Macinti ship designs: vrgMacAip, read by DoMacintiAiTurn. data/datagen.py
# describes the format. Each recipe gives an AiPartPreference per slot of
# its hull; its name becomes a MacintiRecipeOffset, the recipe's offset
# in vrgMacAip. Code picks recipes by position through vrgMacIshAip, so
# keep the order; recipes without a hull are unused.


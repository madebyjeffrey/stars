# Cybertron ship designs: vrgCyberAip, read by DoCyberAiTurn. data/datagen.py
# describes the format. Each recipe gives an AiPartPreference per slot of
# its hull; its name becomes a CybertronRecipe, the recipe's offset
# in vrgCyberAip. Code picks recipes by position through vrgCyberIshAip, so
# keep the order; recipes without a hull are unused.


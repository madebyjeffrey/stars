# AI part preferences: what an AiPartPreference in a design recipe (data/ai/
# *.yaml) means. FGetAIPart tries each preference's parts in order and takes
# the first the player can build. A part with tries N also tries the N - 1
# parts before it in its parts file, nearest first. data/datagen.py builds
# vrgAiParts, vrgcAiParts and the AiPartPreference enum from this file.

- name: aiPartTorpedo
  parts:
    - {part: itorpAntiMatterTorpedo, tries: 8}

- name: aiPartMissile
  parts:
    - {part: itorpArmageddonMissile, tries: 4}


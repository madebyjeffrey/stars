# The AI research orders, read by IroEnsureAi: each turn the AI researches
# the first entry whose level it has not reached, and works on its lowest
# field once it has them all. Each entry is a tech field (TechFieldType) and
# a level. data/datagen.py packs them as (field << 5) | level and generates
# each list's length, cAi...ResOrder, which code passes with the list.

